            function parseToCanonical(dateStr) {
                if (!dateStr) 
                    return null;
                const s = String(dateStr).trim();
                const maybeDateOnly = s.split(' ')[0];

                const dm = maybeDateOnly.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
                if (dm) {
                    let d = parseInt(dm[1], 10);
                    let m = parseInt(dm[2], 10);
                    let y = parseInt(dm[3], 10);
                    if (y < 100) 
                        y += 2000;
                    return `${y
                        .toString()
                        .padStart(4, '0')}-${String(m)
                        .padStart(2, '0')}-${String(d)
                        .padStart(2, '0')}`;
                }

                const iso = maybeDateOnly.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
                if (iso) {
                    const y = iso[1],
                        m = iso[2].padStart(2, '0'),
                        d = iso[3].padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }

                const parts = maybeDateOnly
                    .split(/[\s\-]+/)
                    .filter(Boolean);
                if (parts.length >= 2) {
                    let day = null,
                        month = null,
                        year = null;
                    if (parts.length === 3) {
                        day = parts[0];
                        month = parts[1].toLowerCase();
                        year = parts[2];
                    } else if (parts.length === 2) {
                        day = parts[0];
                        month = parts[1].toLowerCase();
                        year = (new Date()).getFullYear();
                    }
                    if (day && month) {
                        const monthKey = month.toLowerCase();
                        let mnum = null;
                        for (const k of Object.keys(bulanIndo)) {
                            if (k.startsWith(monthKey)) {
                                mnum = bulanIndo[k];
                                break;
                            }
                        }
                        if (mnum) {
                            const d = parseInt(day, 10);
                            const y = parseInt(year, 10);
                            if (!isNaN(d) && !isNaN(y)) {
                                return `${y
                                    .toString()
                                    .padStart(4, '0')}-${String(mnum)
                                    .padStart(2, '0')}-${String(d)
                                    .padStart(2, '0')}`;
                            }
                        }
                    }
                }

                const dt = new Date(s);
                if (!isNaN(dt.getTime())) {
                    const y = dt.getFullYear();
                    const m = (dt.getMonth() + 1)
                        .toString()
                        .padStart(2, '0');
                    const d = dt
                        .getDate()
                        .toString()
                        .padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }

                return null;
            }

            function normalizeName(n) {
                if (!n) 
                    return '';
                
                // Menghapus bagian setelah koma untuk menghilangkan gelar (misal: ", S.IP") dan
                // mengubah ke huruf kecil untuk menangani Title Case/Uppercase
                const nameWithoutTitle = String(n).split(',')[0];
                return nameWithoutTitle
                    .trim()
                    .replace(/\s+/g, ' ')
                    .toLowerCase();
            }

            async function fetchGoogleSheets() {
                statusEl.style.color = '#000';
                statusEl.textContent = 'Sedang mengambil data dari server...';
                try {
                    if (!urlSheetDatang || !urlSheetPulang) {
                        statusEl.textContent = 'URL CSV belum dikonfigurasi.';
                        return;
                    }

                    const [resDatang, resPulang] = await Promise.all(
                        [fetch(urlSheetDatang), fetch(urlSheetPulang)]
                    );

                    if (!resDatang.ok || !resPulang.ok) {
                        throw new Error('Gagal mengambil CSV. Periksa link dan akses publik.');
                    }

                    const csvDatang = await resDatang.text();
                    const csvPulang = await resPulang.text();

                    const parsedDatang = Papa.parse(csvDatang, {
                        header: true,
                        skipEmptyLines: true
                    });
                    const parsedPulang = Papa.parse(csvPulang, {
                        header: true,
                        skipEmptyLines: true
                    });

                    dataMentahDatang = parsedDatang.data || parsedDatang;
                    dataMentahPulang = parsedPulang.data || parsedPulang;

                    statusEl.style.color = 'green';
                    statusEl.textContent = 'Data siap. Masukkan tanggal lalu klik Tampilkan Data.';

                    console.error(err);
                    statusEl.style.color = '#c00';
                    statusEl.textContent = 'Gagal memuat data dari Spreadsheet. Periksa koneksi dan URL CSV.';
                }
            }

            function findRecordFor(rowArray, tanggalCanonical, namaNormalized) {
                if (!rowArray || !Array.isArray(rowArray)) 
                    return null;
                
                if (rowArray.length > 0 && typeof rowArray[0] === 'object' && !Array.isArray(rowArray[0])) {
                    const possibleDateKeys = Object
                        .keys(rowArray[0])
                        .filter(k => /tanggal|date|tgl/i.test(k));
                    const possibleNameKeys = Object
                        .keys(rowArray[0])
                        .filter(k => /nama|name/i.test(k));
                    for (const r of rowArray) {
                        const rawTanggal = possibleDateKeys.length
                            ? r[possibleDateKeys[0]]
                            : Object.values(r)[0];
                        const rawNama = possibleNameKeys.length
                            ? r[possibleNameKeys[0]]
                            : Object.values(r)[1];
                        const canonical = parseToCanonical(rawTanggal);
                        if (!canonical) 
                            continue;
                        if (canonical === tanggalCanonical && normalizeName(rawNama) === namaNormalized) {
                            return r;
                        }
                    }
                    return null;
                }

                for (const r of rowArray) {
                    if (!Array.isArray(r)) 
                        continue;
                    let rawTanggal = null;
                    let rawNama = null;
                    for (let i = 0; i < r.length; i++) {
                        if (parseToCanonical(r[i])) {
                            rawTanggal = r[i];
                            break;
                        }
                    }
                    if (r.length > 1) 
                        rawNama = r[1];
                    const canonical = parseToCanonical(rawTanggal);
                    if (!canonical) 
                        continue;
                    if (canonical === tanggalCanonical && normalizeName(rawNama) === namaNormalized) {
                        return r;
                    }
                }
                return null;
            }

            function extractJamFromRecord(record) {
                if (!record) 
                    return {jam: '-', keterangan: '-'};
                
                if (typeof record === 'object' && !Array.isArray(record)) {
                    const jamKey = Object
                        .keys(record)
                        .find(k => /jam|time|mulai|selesai|start|end/i.test(k));
                    const keteranganKey = Object
                        .keys(record)
                        .find(k => /renc|hasil|kegiatan|keterangan|pekerjaan/i.test(k));
                    const jamVal = jamKey
                        ? (record[jamKey] || '-')
                        : '-';
                    const ketVal = keteranganKey
                        ? (record[keteranganKey] || '-')
                        : '-';
                    return {
                        jam: jamVal || '-',
                        keterangan: ketVal || '-'
                    };
                }

                if (Array.isArray(record)) {
                    const candidates = [2, 4, 3];
                    let jamVal = '-';
                    for (const i of candidates) {
                        if (record[i] && /[:]/.test(String(record[i]))) {
                            jamVal = record[i];
                            break;
                        }
                    }
                    if (jamVal === '-' && record[2]) 
                        jamVal = record[2];
                    const ket = record[3] || record[4] || record[5] || '-';
                    return {
                        jam: jamVal || '-',
                        keterangan: ket || '-'
                    };
                }

                return {jam: '-', keterangan: '-'};
            }

            function formatHeaderDate(tanggalCanonical, rawInput) {
                if (!tanggalCanonical) 
                    return rawInput;
                const [y, m, d] = tanggalCanonical.split('-');

                    'Mar',
                    'Apr',
                    'Mei',
                    'Jun',
                    'Jul',
                    'Agu',
                    'Sep',
                    'Okt',
                    'Nov',
                    'Des'
                ];
                return `${parseInt(d, 10)} ${monthNames[parseInt(m, 10) - 1]} ${y}`;
            }

          <td rowspan="2" class="center small">${pegawai.gol}</td>
          <td class="center ${recDatang
                        ? 'present'
                        : 'missing'}">${jamMulai}</td>
          <td class="center ${recPulang
                            ? 'present'
                            : 'missing'}">${jamSelesai}</td>
        `;

                    const trBawah = document.createElement('tr');
                    trBawah.innerHTML = `
          <td>${kegiatanPagi}</td>
          <td>${kegiatanSore}</td>
        `;

                    tableBody.appendChild(trAtas);
                    tableBody.appendChild(trBawah);
                });

                summaryEl.innerHTML = `Jumlah pegawai: <strong>${dbPegawai.length}</strong> &nbsp; Hadir (ada minimal 1 absen): <strong>${hadirCount}</strong> &nbsp; Belum absen: <strong>${belumCount}</strong>`;
                tabelEl
                    .classList
                    .remove('hidden');
                tabelEl.style.display = 'table';
            }

            btnTampilkan.addEventListener('click', filterDataAndRender);
            btnRefresh.addEventListener('click', fetchGoogleSheets);
            btnHideMissing.addEventListener('click', () => {
                // toggle highlight class on table
                const cells = tableBody.querySelectorAll('td.missing');
                cells.forEach(c => c.classList.toggle('hidden'));
            });

            window.addEventListener('load', () => {
                fetchGoogleSheets();
            });

            inputTanggal.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    filterDataAndRender();
                }
            });
        </script>
    </body>
</html>
